<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="#f59e0b" stroke-width="6" stroke-opacity="0.4" />

  <!-- Stars Background -->
  <circle cx="90" cy="110" r="4" fill="#fde047" opacity="0.8" />
  <circle cx="420" cy="130" r="5" fill="#fde047" opacity="0.8" />
  <circle cx="390" cy="80" r="3" fill="#fde047" opacity="0.9" />
  <circle cx="130" cy="70" r="3" fill="#fde047" opacity="0.7" />

  <!-- Steam Clouds -->
  <circle cx="160" cy="140" r="22" fill="#ffffff" opacity="0.8" />
  <circle cx="195" cy="115" r="30" fill="#ffffff" opacity="0.85" />
  <circle cx="245" cy="95" r="38" fill="#ffffff" opacity="0.9" />

  <!-- Train Rails -->
  <path d="M 40 400 L 472 400" stroke="#94a3b8" stroke-width="12" stroke-linecap="round" />
  <path d="M 40 424 L 472 424" stroke="#64748b" stroke-width="10" stroke-linecap="round" />
  <!-- Ties -->
  <path d="M 70 392 L 70 432 M 130 392 L 130 432 M 190 392 L 190 432 M 250 392 L 250 432 M 310 392 L 310 432 M 370 392 L 370 432 M 430 392 L 430 432" stroke="#451a03" stroke-width="14" stroke-linecap="round" />

  <!-- Train Locomotive Body -->
  <rect x="80" y="240" width="220" height="130" rx="28" fill="url(#cabGrad)" filter="url(#glow)" />
  <rect x="220" y="190" width="130" height="180" rx="24" fill="url(#trainGrad)" />

  <!-- Chimney -->
  <path d="M 135 240 L 135 180 L 165 180 L 165 240 Z" fill="#334155" />
  <ellipse cx="150" cy="180" rx="20" ry="6" fill="#f59e0b" />

  <!-- Window -->
  <rect x="245" y="215" width="80" height="70" rx="14" fill="#38bdf8" stroke="#1e293b" stroke-width="5" />
  <path d="M 285 215 L 285 285 M 245 250 L 325 250" stroke="#1e293b" stroke-width="3" />

  <!-- Headlight -->
  <circle cx="75" cy="300" r="16" fill="#fde047" stroke="#d97706" stroke-width="4" />
  <path d="M 70 290 L 30 260 L 30 340 Z" fill="#fef08a" opacity="0.35" />

  <!-- Math Numbers on Locomotive -->
  <text x="160" y="325" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">1 2 3</text>

  <!-- Wheels -->
  <!-- Back Big Wheel -->
  <circle cx="285" cy="385" r="38" fill="#1e293b" stroke="#f59e0b" stroke-width="8" />
  <circle cx="285" cy="385" r="12" fill="#fbbf24" />
  <!-- Front Wheels -->
  <circle cx="120" cy="392" r="28" fill="#1e293b" stroke="#f59e0b" stroke-width="7" />
  <circle cx="120" cy="392" r="9" fill="#fbbf24" />
  <circle cx="185" cy="392" r="28" fill="#1e293b" stroke="#f59e0b" stroke-width="7" />
  <circle cx="185" cy="392" r="9" fill="#fbbf24" />

  <!-- Golden Crown / Star Badge on top -->
  <polygon points="380,180 395,215 430,215 402,236 412,270 380,250 348,270 358,236 330,215 365,215" fill="#facc15" stroke="#ca8a04" stroke-width="3" filter="url(#glow)" />
</svg>
